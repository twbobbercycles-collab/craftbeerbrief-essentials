# Supabase local development configuration
# Run "supabase start" to spin up a local Supabase instance for development
# Run "supabase db push" to apply migrations to your remote project

[api]
# Port for the local Supabase API
port = 54321

[db]
# Port for the local Postgres database
port = 54322

[studio]
# Port for the local Supabase Studio (web UI)
port = 54323

[inbucket]
# Port for the local email testing server (catches all outbound emails in dev)
port = 54324

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600

[auth.email]
enable_confirmations = false  # Set to true in production

[functions]
# Edge functions are automatically picked up from supabase/functions/
# Each folder becomes a function endpoint at /functions/v1/<folder-name>

# =============================================================================
# Cron job: compliance-alerts — runs every day at 8:00 AM UTC
# Sends proactive compliance deadline reminder emails to all active subscribers.
#
# Supabase supports scheduling via config.toml (preferred) OR pg_cron (fallback).
# =============================================================================

# =============================================================================
# FALLBACK: pg_cron SQL (use this if config.toml scheduling is not available
# on your Supabase plan, or to add the job manually via the SQL editor).
#
# Run this in Supabase Dashboard → SQL Editor:
#
# select cron.schedule(
#   'compliance-alerts-daily',
#   '0 8 * * *',
#   $$
#   select net.http_post(
#     url := 'https://orjekijkixswvnzenilb.supabase.co/functions/v1/compliance-alerts',
#     headers := '{"Authorization": "Bearer ' || current_setting('app.service_role_key') || '"}'::jsonb
#   )
#   $$
# );
#
# To check it was created:   SELECT * FROM cron.job;
# To remove it:              SELECT cron.unschedule('compliance-alerts-daily');
# =============================================================================

# =============================================================================
# Cron job: grants-sync — DISABLED (grants data is now manually curated)
# SQL to remove the old job if it's still running:
#   SELECT cron.unschedule('grants-sync-daily');
# =============================================================================
