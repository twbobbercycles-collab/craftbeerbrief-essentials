<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Navy background -->
  <circle cx="16" cy="16" r="16" fill="#1A2744"/>

  <!-- Stem -->
  <line x1="16" y1="6.5" x2="16" y2="10.5" stroke="#C8871A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Small leaves off the stem -->
  <ellipse cx="13.2" cy="8.2" rx="2.4" ry="0.9" fill="#C8871A" transform="rotate(-35 13.2 8.2)"/>
  <ellipse cx="18.8" cy="8.2" rx="2.4" ry="0.9" fill="#C8871A" transform="rotate(35 18.8 8.2)"/>

  <!-- Hop cone — layered bracts from bottom (widest) to top (narrowest) -->
  <!-- Bottom bract -->
  <ellipse cx="16" cy="22.5" rx="5.2" ry="2.2" fill="#A86E14"/>
  <!-- Bract 2 -->
  <ellipse cx="16" cy="20" rx="5" ry="2.2" fill="#C8871A"/>
  <!-- Bract 3 -->
  <ellipse cx="16" cy="17.5" rx="4.4" ry="2.2" fill="#D4931E"/>
  <!-- Bract 4 -->
  <ellipse cx="16" cy="15" rx="3.7" ry="2.1" fill="#C8871A"/>
  <!-- Bract 5 -->
  <ellipse cx="16" cy="12.8" rx="2.8" ry="1.8" fill="#D4931E"/>
  <!-- Top bract / tip -->
  <ellipse cx="16" cy="11" rx="1.7" ry="1.4" fill="#C8871A"/>
</svg>
